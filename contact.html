<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form>
      <fieldset>
        <legend>contactez-moi</legend>
        <label for="c0">civilites:</label>
        <label for="c1">monsieur</label>
        <input id="c1" type="radio" name="genre" />
        <label for="c2">mademe</label>
        <input id="c2" type="radio" name="genre" />
        <label for="c3">mademoiselle</label>
        <input id="c3" type="radio" name="genre" />
        <br />
        <label for="c4">nom</label>
        <input type="text" id="c4" placeholder="votre nom" />
        <label for="c5">prenom</label>
        <input type="text" id="c5" placeholder="votre prenom" />
        <br />
        <label for="c6">email</label>
        <input type="email" id="c6" placeholder="votre email" />
        <label for="c7">telephone</label>
        <input type="number" id="c7" placeholder="votre phone" />
        <br />
        <label for="c8">sujet</label>
        <input type="text" id="c8" placeholder="votre sujet" />
        <br />
        <label for="c9">message</label>
        <textarea name="text" id="c9" cols="30" rows="10"></textarea>
        <input type="submit" value="envoyer" />
        <input type="reset" value="annuler" />
      </fieldset>
    </form>
  </body>
</html>
